<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="t d">
  <title id="t">Panel de analítica con IA</title>
  <desc id="d">Ilustración de un panel con datos históricos, una predicción con banda de confianza y una recomendación generada por IA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE7FF"/>
      <stop offset="1" stop-color="#DDF5EC"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B8FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#C9B8FF" stop-opacity=".15"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2B2560" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="560" height="440" rx="32" fill="url(#bg)"/>
  <circle cx="480" cy="70" r="46" fill="#FFE3D6"/>
  <circle cx="70" cy="380" r="36" fill="#DDEEFF"/>

  <!-- tarjeta principal -->
  <g filter="url(#s)">
    <rect x="40" y="48" width="380" height="250" rx="20" fill="#fff"/>
  </g>
  <text x="64" y="84" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2560">Demanda mensual</text>
  <text x="64" y="104" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#6B6890">Histórico vs. predicción</text>
  <!-- ejes -->
  <g stroke="#ECEAF5" stroke-width="1">
    <line x1="64" y1="140" x2="396" y2="140"/>
    <line x1="64" y1="180" x2="396" y2="180"/>
    <line x1="64" y1="220" x2="396" y2="220"/>
    <line x1="64" y1="260" x2="396" y2="260"/>
  </g>
  <!-- banda de confianza -->
  <path d="M260 196 L300 170 L340 160 L380 130 L380 196 L340 206 L300 214 L260 204 Z" fill="url(#band)"/>
  <!-- historico -->
  <polyline points="64,238 100,226 136,232 172,210 208,216 244,196 260,200" fill="none" stroke="#2B2560" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- prediccion -->
  <polyline points="260,200 300,192 340,183 380,163" fill="none" stroke="#7B61FF" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
  <line x1="260" y1="120" x2="260" y2="268" stroke="#C9C4E6" stroke-dasharray="4 4"/>
  <text x="222" y="284" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#6B6890">Hoy</text>
  <text x="300" y="284" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#7B61FF">Pronóstico</text>
  <circle cx="260" cy="200" r="6" fill="#FFB8A3" stroke="#2B2560" stroke-width="2"/>

  <!-- tarjeta recomendacion -->
  <g filter="url(#s)">
    <rect x="300" y="236" width="222" height="130" rx="18" fill="#fff"/>
  </g>
  <rect x="318" y="256" width="36" height="36" rx="10" fill="#DDF5EC"/>
  <path d="M327 274 L333 280 L345 266" fill="none" stroke="#3E9C7F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="364" y="270" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B2560">Recomendación</text>
  <text x="364" y="287" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#6B6890">Análisis prescriptivo</text>
  <text x="318" y="318" font-family="Poppins, Arial, sans-serif" font-size="11.5" fill="#2B2560">Aumentar inventario 12 %</text>
  <text x="318" y="336" font-family="Poppins, Arial, sans-serif" font-size="11.5" fill="#2B2560">antes de la temporada alta.</text>
  <rect x="318" y="346" width="150" height="6" rx="3" fill="#ECEAF5"/>
  <rect x="318" y="346" width="118" height="6" rx="3" fill="#9FE3CD"/>

  <!-- tarjeta barras -->
  <g filter="url(#s)">
    <rect x="70" y="318" width="200" height="92" rx="18" fill="#fff"/>
  </g>
  <text x="90" y="344" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#2B2560">Riesgo por zona</text>
  <rect x="92" y="372" width="18" height="24" rx="4" fill="#DDEEFF"/>
  <rect x="120" y="360" width="18" height="36" rx="4" fill="#C9B8FF"/>
  <rect x="148" y="380" width="18" height="16" rx="4" fill="#9FE3CD"/>
  <rect x="176" y="354" width="18" height="42" rx="4" fill="#FFB8A3"/>
  <rect x="204" y="368" width="18" height="28" rx="4" fill="#DDEEFF"/>
  <rect x="232" y="364" width="18" height="32" rx="4" fill="#C9B8FF"/>

  <!-- nodos IA -->
  <g stroke="#7B61FF" stroke-width="2" opacity=".7">
    <line x1="462" y1="112" x2="500" y2="150"/>
    <line x1="462" y1="112" x2="440" y2="170"/>
    <line x1="500" y1="150" x2="440" y2="170"/>
    <line x1="500" y1="150" x2="505" y2="205"/>
    <line x1="440" y1="170" x2="505" y2="205"/>
  </g>
  <g fill="#fff" stroke="#2B2560" stroke-width="2.5">
    <circle cx="462" cy="112" r="9"/>
    <circle cx="500" cy="150" r="9"/>
    <circle cx="440" cy="170" r="9"/>
    <circle cx="505" cy="205" r="9"/>
  </g>
</svg>
